# Portable local smoke/training profile. Uses CUDA, MPS, or CPU automatically;
# unlike the production Mistral profile it does not require bitsandbytes.
data:
  output_dir: data/arr
  ds_main_source: data/arr/DSCB-train-crowd-anno.jsonl
  ds_dev_source: data/arr/DSCB-dev-crowd-anno.jsonl
  train_data: data/arr/ds_critique_external_test.jsonl
  validation_data: data/arr/ds_critique_external_dev.jsonl

judge_training:
  base_model: sshleifer/tiny-gpt2
  revision: main
  local_files_only: false
  architecture: decoder
  device: auto
  qlora: false
  dtype: float32
  max_length: 256
  epochs: 5
  max_epochs: 5
  group_batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00002
  scheduler: linear
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  loss: mse
  seed: 42

epistemic:
  method: independent_head_disagreement
  head_count: 5
  hidden_dim: 256
  dropout_min: 0.05
  dropout_max: 0.30
  lambda_div: 0.0
  mc_dropout: 0
  bootstrap_members: false
  feature_keep_fraction: 1.0
  feature_seed: 42
  variance_estimator: population_ddof_0
  central_score: head_mean
  credal_interval: head_min_max

evaluation:
  batch_size: 1
  max_length: 256
  local_files_only: false

statistics:
  bootstrap_samples: 10000
  confidence: 0.95
  multiple_testing: holm
