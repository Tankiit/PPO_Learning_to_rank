[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "explrank"
version = "0.1.0"
description = "Learning-to-rank reward models for explanation quality"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Explanation Ranking Team" }]
dependencies = [
    "torch>=2.0",
    "transformers>=4.36",
    "datasets>=2.14",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.66",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "black>=24.0",
    "isort>=5.13",
    "pre-commit>=3.6",
]
wandb = ["wandb>=0.16"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.8", "seaborn>=0.13"]

[project.scripts]
explrank-train = "scripts.train:main"
explrank-precompute = "scripts.precompute_teacher_scores:main"
explrank-distill = "scripts.finetune_with_distillation:main"
explrank-eval-xd = "scripts.evaluate_cross_domain:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["explrank"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
